name: Rust Stable

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, ubuntu-24.04-arm]
    steps:
    - uses: actions/checkout@v4
    - name: Update
      run: rustup update
    - name: Build
      run: cargo build --verbose
    - name: Check without default features
      run: |
        cargo check --all-targets --no-default-features
        cargo check --all-targets --no-default-features --features std
    - name: Check no_std target
      if: matrix.os == 'ubuntu-latest'
      run: |
        rustup target add thumbv7em-none-eabihf
        cargo check --no-default-features --target thumbv7em-none-eabihf
    - name: Check formatting
      if: matrix.os == 'ubuntu-latest'
      # `cargo fmt` does not reach the backend modules behind `moddef!`.
      run: git ls-files '*.rs' | xargs rustfmt --check --edition 2021
    - name: Check MSRV
      run: |
        rustup toolchain install 1.94 --profile minimal
        cargo +1.94 check
    - name: Run tests
      run: cargo test --workspace --verbose
    - name: Run tests in release
      run: cargo test --workspace --release --verbose
    - name: Run tests without default features
      run: cargo test --no-default-features --verbose
